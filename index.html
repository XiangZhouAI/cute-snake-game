<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140e28">
  <title>Starlight Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff9a3c'/%3E%3Ccircle cx='6' cy='6.2' r='1.3' fill='%23fff'/%3E%3Ccircle cx='10' cy='6.2' r='1.3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="wrap">
    <header class="top">
      <div class="titles">
        <h1>Starlight Snake</h1>
        <p class="score" id="score" aria-live="polite">Score 0</p>
      </div>
      <div class="moon" title="Moon" aria-hidden="true"></div>
    </header>
    <p class="hint">Arrows or WASD, swipe the board, or tap the buttons. Touch works both ways.</p>
    <p class="mode-note" id="mode-note">Pip hunts treats and does not chase you.</p>
    <div class="modes" role="group" aria-label="Bot mood">
      <button type="button" data-mode="lazy" aria-pressed="true">Lazy</button>
      <button type="button" data-mode="between" aria-pressed="false">In between</button>
      <button type="button" data-mode="aggressive" aria-pressed="false">Aggressive</button>
    </div>
    <div class="sizes" role="group" aria-label="World size">
      <button type="button" data-size="medium" aria-pressed="false">Medium</button>
      <button type="button" data-size="large" aria-pressed="true">Large</button>
      <button type="button" data-size="huge" aria-pressed="false">Huge</button>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="480" height="480">This game draws on a canvas.</canvas>
    </div>
    <p class="dpad-label">On-screen buttons</p>
    <div class="dpad" role="group" aria-label="Directional buttons">
      <button type="button" class="up" data-dx="0" data-dy="-1" aria-label="Move up">▲</button>
      <button type="button" class="left" data-dx="-1" data-dy="0" aria-label="Move left">◀</button>
      <button type="button" class="down" data-dx="0" data-dy="1" aria-label="Move down">▼</button>
      <button type="button" class="right" data-dx="1" data-dy="0" aria-label="Move right">▶</button>
    </div>
    <p class="lengths" id="lengths">
      <span class="swatch you" aria-hidden="true"></span><span id="you-len">You 4</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="swatch pip" aria-hidden="true"></span><span id="pip-len">Pip 4</span>
    </p>
    <p class="lan" id="lan" hidden></p>
    <noscript><p class="hint">JavaScript needs to be on. The game is one page and does not need an install.</p></noscript>
  </main>
  <script src="game.js"></script>
</body>
</html>
